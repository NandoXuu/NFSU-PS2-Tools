name: NFSU2 Android

on:
  push:
    paths:
      - "nfsu2-android/**"
      - ".github/workflows/nfsu2-android.yml"
  pull_request:
    paths:
      - "nfsu2-android/**"
      - ".github/workflows/nfsu2-android.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: nfsu2-android

jobs:
  host-tests:
    name: Testes no host (C++ e conversor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build -j"$(nproc)"

      - name: Testes unitarios C++
        run: ctest --test-dir build --output-on-failure

      - name: Testes do conversor de assets
        run: python3 -m unittest discover -s tests/tools -v

  android-apk:
    name: Gerar APK (arm64-v8a)
    needs: host-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK, CMake e plataforma
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        working-directory: nfsu2-android/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-diag-arm64-v8a-debug
          path: nfsu2-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
